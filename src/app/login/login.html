<div class="container">

<h2>Login</h2>


<form>


<div class="form-group">

<label>Email:</label>

<input 
type="email"
class="form-control"
[(ngModel)]="email"
name="email">

</div>



<div class="form-group">

<label>Password:</label>

<input 
type="password"
class="form-control"
[(ngModel)]="password"
name="password">

</div>



<button 
class="btn btn-primary"
type="button"
(click)="login()">

Login

</button>


</form>


<p style="color:red">
{{errorMessage}}
</p>


</div>
